<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050b16" />
<meta name="description" content="El Canon de Occidente: un globo semántico que conecta personas, obras, ideas, eventos y lugares en un grafo 3D navegable." />
<title>El Canon de Occidente</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23050b16'/><circle cx='50' cy='50' r='26' fill='none' stroke='%236ea8fe' stroke-width='6'/><ellipse cx='50' cy='50' rx='26' ry='10' fill='none' stroke='%23b28cff' stroke-width='4'/></svg>" />
<style>
  :root{
    color-scheme: dark;
    --bg:#050b16; --panel:rgba(11,20,36,.94); --text:#f2f6ff; --muted:#8fa6c8;
    --accent:#6ea8fe; --accent-2:#b28cff; --line:rgba(255,255,255,.09);
    --radius:14px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; -webkit-tap-highlight-color:transparent; }
  button{ font:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }

  /* colores por grupo */
  .g-persona{ --gc:#6ea8fe; } .g-obra{ --gc:#b28cff; } .g-idea{ --gc:#4ade80; }
  .g-evento{ --gc:#fb923c; } .g-lugar{ --gc:#22d3ee; }

  /* ---------- Escenario ---------- */
  #g-stage{ position:fixed; inset:0; overflow:hidden; background:var(--bg); }
  #graph3d{ position:absolute; inset:0; touch-action:none; cursor:grab; }
  #graph3d canvas{ display:block; width:100%; height:100%; }
  .g-fallback{
    position:absolute; inset:0; display:grid; place-content:center; gap:8px;
    text-align:center; color:var(--muted); padding:24px;
  }
  .g-fallback strong{ color:var(--text); font-size:1.1rem; }

  /* etiquetas proyectadas */
  .g-labels{ position:absolute; inset:0; pointer-events:none; z-index:2; }
  .g-label{
    position:absolute; top:0; left:0; pointer-events:auto; will-change:transform;
    background:rgba(5,11,22,.66); color:#e8eefb;
    border:1px solid rgba(255,255,255,.12); border-left:3px solid var(--gc);
    border-radius:7px; padding:3px 8px;
    font-family:inherit; font-weight:600; font-size:11.5px; line-height:1.25;
    white-space:nowrap; cursor:pointer; backdrop-filter:blur(3px);
    max-width:190px; overflow:hidden; text-overflow:ellipsis;
  }
  .g-label:hover{ background:rgba(5,11,22,.92); border-color:var(--gc); }
  .g-label.is-selected{
    background:var(--gc); color:#04111f; border-color:var(--gc);
    font-size:13px; z-index:3; box-shadow:0 0 22px -4px var(--gc);
  }

  /* ---------- Barra superior ---------- */
  .g-bar{
    position:absolute; top:0; left:0; right:0; z-index:6;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:12px 14px; padding-top:calc(12px + env(safe-area-inset-top));
    background:linear-gradient(rgba(5,11,22,.9),rgba(5,11,22,0));
    pointer-events:none;
  }
  .g-bar > *{ pointer-events:auto; }
  .brand{
    margin:0 auto 0 0; display:flex; align-items:center; gap:9px; font-weight:700;
    font-size:clamp(.92rem,2.6vw,1.05rem); letter-spacing:.01em; white-space:nowrap;
  }
  .brand svg{ width:22px; height:22px; flex:0 0 auto; }
  .g-searchwrap{ position:relative; flex:0 1 260px; min-width:150px; }
  #g-search{
    width:100%; min-height:38px; padding:8px 12px; border-radius:10px;
    background:rgba(11,20,36,.88); border:1px solid var(--line); color:var(--text);
    font:inherit; font-size:.9rem; backdrop-filter:blur(8px);
  }
  #g-search::placeholder{ color:var(--muted); }
  #g-results{
    display:none; position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:8;
    background:#0b1424; border:1px solid var(--line); border-radius:10px; overflow:hidden;
    box-shadow:0 16px 40px rgba(0,0,0,.55);
  }
  #g-results.is-open{ display:block; }
  .g-result{
    display:flex; align-items:center; gap:8px; width:100%; min-height:40px;
    padding:8px 12px; background:none; border:none; border-bottom:1px solid var(--line);
    color:var(--text); font-size:.9rem; text-align:left; cursor:pointer;
  }
  .g-result:last-child{ border-bottom:none; }
  .g-result:hover,.g-result:focus-visible{ background:rgba(110,168,254,.14); }

  .g-btn{
    min-height:38px; padding:8px 12px; border-radius:10px; cursor:pointer;
    background:rgba(11,20,36,.88); border:1px solid var(--line); color:var(--muted);
    font-size:.82rem; white-space:nowrap; backdrop-filter:blur(8px);
    transition:color .15s ease, border-color .15s ease;
  }
  .g-btn:hover,.g-btn:focus-visible{ color:var(--text); border-color:var(--accent); }

  /* ---------- Filtros de grupo ---------- */
  #g-toolbar{
    position:absolute; z-index:5; left:14px; top:66px;
    max-width:min(calc(100% - 28px), 460px); pointer-events:none;
  }
  #g-toolbar > *{ pointer-events:auto; }
  .g-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .g-chip{
    display:inline-flex; align-items:center; gap:7px; min-height:34px;
    padding:5px 11px; border-radius:999px; cursor:pointer;
    background:rgba(11,20,36,.88); border:1px solid var(--line);
    color:var(--muted); font-size:.79rem; backdrop-filter:blur(8px);
    transition:opacity .15s ease, border-color .15s ease, color .15s ease;
  }
  .g-chip[aria-pressed="true"]{ color:var(--text); border-color:var(--gc); }
  .g-chip[aria-pressed="false"]{ opacity:.42; }
  .g-chip[aria-pressed="false"] .g-dot{ background:transparent; border:1px solid currentColor; }
  .g-count{ color:var(--muted); font-size:.7rem; }

  /* ---------- Ventana temporal ---------- */
  .g-window{
    margin-top:8px; width:min(300px,100%); padding:9px 12px 10px; border-radius:12px;
    background:rgba(11,20,36,.88); border:1px solid var(--line); backdrop-filter:blur(8px);
  }
  .w-row{ display:flex; align-items:center; gap:7px; }
  .w-label{
    font-size:.68rem; text-transform:uppercase; letter-spacing:.11em;
    color:var(--muted); font-weight:700; white-space:nowrap;
  }
  #g-years{
    width:82px; min-height:28px; padding:3px 8px; border-radius:8px; text-align:right;
    background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--text);
    font:inherit; font-size:.82rem; font-variant-numeric:tabular-nums;
  }
  .w-unit{ color:var(--muted); font-size:.74rem; margin-right:auto; }
  #g-range{
    width:100%; margin:8px 0 4px; accent-color:var(--accent);
    background:transparent; cursor:pointer;
  }
  .w-info{
    margin:0; display:flex; justify-content:space-between; gap:10px;
    color:var(--muted); font-size:.7rem; font-variant-numeric:tabular-nums;
  }
  #g-span{ color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .g-dot{ width:9px; height:9px; border-radius:50%; background:var(--gc); flex:0 0 auto; box-shadow:0 0 8px -1px var(--gc); }

  /* ---------- Brújula ---------- */
  #g-compass{
    position:absolute; z-index:5; right:14px; bottom:calc(var(--time-h) + 16px);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--muted); font-size:.7rem; letter-spacing:.06em; pointer-events:none;
    transition:bottom .25s ease;
  }
  #g-compass svg{ width:74px; height:74px; overflow:visible; }
  .c-ring{ fill:rgba(9,17,31,.5); stroke:rgba(255,255,255,.16); stroke-width:1; }
  .c-grid{ fill:none; stroke:rgba(255,255,255,.13); stroke-width:.8; }
  .c-eq{ fill:none; stroke:rgba(110,168,254,.5); stroke-width:1; }
  .c-axis{ stroke:rgba(255,255,255,.2); stroke-width:.8; }
  .c-dot{ fill:var(--accent); }
  #c-read{ font-variant-numeric:tabular-nums; }

  /* ---------- Ficha ---------- */
  #g-panel{
    position:absolute; z-index:7; top:66px; right:14px; width:min(346px,calc(100% - 28px));
    max-height:calc(100% - var(--time-h) - 90px); display:none; flex-direction:column;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 22px 60px rgba(0,0,0,.6); backdrop-filter:blur(12px);
    transition:max-height .25s ease;
  }
  #g-panel.is-open{ display:flex; }
  #g-close{
    position:absolute; top:9px; right:9px; z-index:2;
    width:32px; height:32px; border-radius:9px; cursor:pointer;
    background:rgba(255,255,255,.07); border:1px solid var(--line); color:var(--text); font-size:.95rem;
  }
  #g-close:hover{ background:rgba(255,255,255,.14); }
  #g-panel-body{ overflow-y:auto; padding:16px; overscroll-behavior:contain; }
  .g-panel-head{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding-right:38px; }
  .g-pill{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:.7rem;
    text-transform:uppercase; letter-spacing:.09em; font-weight:700;
    background:rgba(255,255,255,.08); color:var(--gc); border:1px solid currentColor;
  }
  @supports (background: color-mix(in srgb, red 20%, transparent)){
    .g-pill{
      background:color-mix(in srgb, var(--gc) 18%, transparent);
      border-color:color-mix(in srgb, var(--gc) 45%, transparent);
    }
  }
  .g-dates{ color:var(--muted); font-size:.8rem; }
  .g-panel-title{ margin:10px 0 6px; font-size:1.24rem; line-height:1.2; }
  .g-summary{ margin:0 0 14px; color:var(--muted); font-size:.91rem; }
  .g-links{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .g-link{
    display:inline-flex; align-items:center; min-height:34px; padding:6px 13px;
    border-radius:999px; background:rgba(110,168,254,.14); border:1px solid rgba(110,168,254,.3);
    color:#cfe1ff; font-size:.82rem; font-weight:600;
  }
  .g-link:hover,.g-link:focus-visible{ background:rgba(110,168,254,.26); }
  .g-link::after{ content:'↗'; margin-left:6px; font-size:.76rem; opacity:.75; }
  .g-sub{
    margin:0 0 8px; font-size:.68rem; text-transform:uppercase; letter-spacing:.12em;
    color:var(--muted); font-weight:700;
  }
  .g-travel{ display:grid; gap:4px; }
  .g-travel-item{
    display:flex; align-items:center; gap:9px; width:100%; min-height:40px;
    padding:7px 10px; border-radius:9px; cursor:pointer; text-align:left;
    background:rgba(255,255,255,.035); border:1px solid transparent; color:var(--text);
  }
  .g-travel-item:hover,.g-travel-item:focus-visible{ background:rgba(110,168,254,.13); border-color:rgba(110,168,254,.3); }
  .g-travel-item.is-off{ opacity:.42; }
  .g-travel-txt{ display:flex; flex-direction:column; min-width:0; }
  .g-travel-txt strong{ font-size:.88rem; font-weight:600; }
  .g-travel-txt em{ font-style:normal; font-size:.73rem; color:var(--muted); }

  /* ---------- Cronología ---------- */
  :root{ --time-h:196px; }
  #g-time{
    position:absolute; z-index:6; left:0; right:0; bottom:0;
    background:linear-gradient(rgba(5,11,22,0),rgba(5,11,22,.86) 22%,rgba(5,11,22,.96));
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    transition:transform .25s ease;
  }
  #g-time.is-collapsed{ transform:translateY(calc(100% - 44px)); }
  .t-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
  .t-head h2{
    margin:0; font-size:.72rem; text-transform:uppercase; letter-spacing:.14em;
    color:var(--muted); font-weight:700; white-space:nowrap;
  }
  #t-context{
    color:var(--text); font-size:.82rem; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;
  }
  #t-toggle{
    margin-left:auto; flex:0 0 auto; min-height:30px; padding:4px 11px; border-radius:999px;
    background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--muted);
    font-size:.74rem; cursor:pointer;
  }
  #t-toggle:hover{ color:var(--text); }
  .t-types{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px; }
  .t-type{
    display:inline-flex; align-items:center; gap:6px; min-height:28px;
    padding:3px 10px; border-radius:999px; cursor:pointer; font-size:.74rem;
    background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--muted);
    transition:opacity .15s ease, color .15s ease, border-color .15s ease;
  }
  .t-type[aria-pressed="true"]{ color:var(--text); border-color:var(--gc); background:rgba(255,255,255,.07); }
  .t-type[aria-pressed="false"]{ opacity:.5; }
  .t-type[aria-pressed="false"] .g-dot{ background:transparent; border:1px solid currentColor; box-shadow:none; }
  .t-type .g-dot{ width:8px; height:8px; }
  .t-type-n{ font-size:.68rem; color:var(--muted); font-variant-numeric:tabular-nums; }

  .t-axis{
    position:relative; height:14px; margin:0 2px 4px;
    display:flex; align-items:center; justify-content:space-between;
    color:var(--muted); font-size:.66rem; letter-spacing:.05em;
  }
  .t-axis::before{
    content:''; position:absolute; left:0; right:0; top:50%; height:1px;
    background:linear-gradient(90deg,rgba(110,168,254,0),rgba(110,168,254,.55),rgba(178,140,255,.55),rgba(178,140,255,0));
  }
  .t-axis span{ position:relative; background:#070e1c; padding:0 6px; }
  #t-track{
    display:flex; gap:8px; overflow-x:auto; overflow-y:hidden;
    padding:4px 2px 6px; scrollbar-width:thin; scroll-behavior:smooth;
  }
  #t-track::-webkit-scrollbar{ height:6px; }
  #t-track::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:99px; }
  .t-card{
    position:relative; flex:0 0 auto; width:154px; min-height:76px;
    display:flex; flex-direction:column; gap:2px; text-align:left; cursor:pointer;
    padding:9px 11px 10px; border-radius:11px; color:var(--text);
    background:rgba(15,25,44,.9); border:1px solid var(--line);
    border-top:2px solid var(--gc);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .t-card:hover,.t-card:focus-visible{ transform:translateY(-2px); border-color:var(--gc); background:rgba(21,34,58,.96); }
  .t-card.is-selected{
    background:rgba(110,168,254,.1); border-color:var(--gc);
    box-shadow:0 0 0 1px var(--gc), 0 10px 30px -12px var(--gc);
  }
  .t-card.is-linked::after{
    content:''; position:absolute; top:7px; right:8px;
    width:6px; height:6px; border-radius:50%; background:var(--gc); box-shadow:0 0 8px -1px var(--gc);
  }
  .t-year{ color:var(--gc); font-size:.72rem; font-weight:700; letter-spacing:.04em; }
  .t-name{
    font-size:.85rem; font-weight:600; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .t-rel{ margin-top:auto; color:var(--muted); font-size:.7rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .t-empty{ margin:0; color:var(--muted); font-size:.82rem; padding:14px 2px; }

  /* ---------- Ayuda inicial ---------- */
  #g-hint{
    position:absolute; z-index:4; left:50%; bottom:calc(var(--time-h) + 18px);
    margin:0; transform:translateX(-50%); pointer-events:none;
    padding:7px 14px; border-radius:999px; white-space:nowrap;
    background:rgba(11,20,36,.8); border:1px solid var(--line);
    color:var(--muted); font-size:.76rem; backdrop-filter:blur(6px);
    transition:opacity .5s ease;
  }
  #g-hint.is-gone{ opacity:0; }

  @media (max-width:860px){
    :root{ --time-h:188px; }
    #g-panel{
      top:auto; bottom:var(--time-h); left:0; right:0; width:100%;
      max-height:min(58%, 420px); border-radius:16px 16px 0 0; border-bottom:none;
    }
    #g-compass{ display:none; }
  }
  @media (max-width:700px){
    :root{ --time-h:180px; }
    .g-bar{ padding:10px; gap:6px; }
    .brand span{ display:none; }
    .g-searchwrap{ flex:1 1 auto; }
    #g-toolbar{ left:10px; right:10px; top:58px; max-width:none; }
    .g-chip{ font-size:.72rem; padding:4px 9px; min-height:30px; }
    .g-count{ display:none; }
    .t-card{ width:136px; min-height:70px; }
    #g-hint{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div id="g-stage">
  <div id="graph3d"></div>

  <div class="g-bar">
    <h1 class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="12" fill="none" stroke="#6ea8fe" stroke-width="1.6"/>
        <ellipse cx="16" cy="16" rx="12" ry="4.6" fill="none" stroke="#b28cff" stroke-width="1.4"/>
        <ellipse cx="16" cy="16" rx="4.6" ry="12" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.1"/>
        <circle cx="16" cy="16" r="2.4" fill="#6ea8fe"/>
      </svg>
      <span>El Canon de Occidente</span>
    </h1>

    <div class="g-searchwrap">
      <input id="g-search" type="search" placeholder="Buscar en el canon…" autocomplete="off" aria-label="Buscar entidad" />
      <div id="g-results" role="listbox"></div>
    </div>
    <button type="button" class="g-btn" id="g-labels-btn">Etiquetas</button>
    <button type="button" class="g-btn" id="g-reset">Reiniciar</button>
    <button type="button" class="g-btn" id="g-fullscreen">Ampliar</button>
  </div>

  <div id="g-toolbar">
    <div id="g-chipbox"></div>
    <div class="g-window">
      <div class="w-row">
        <label class="w-label" for="g-years">Ventana ±</label>
        <input id="g-years" type="number" min="1" max="1000000" step="1" inputmode="numeric" aria-label="Años alrededor del elemento seleccionado" />
        <span class="w-unit">años</span>
      </div>
      <input id="g-range" type="range" min="0" max="100" step="1" aria-label="Amplitud de la ventana temporal" />
      <p class="w-info"><span id="g-count"></span><span id="g-span"></span></p>
    </div>
  </div>

  <div id="g-compass" aria-hidden="true">
    <svg viewBox="0 0 64 64">
      <circle class="c-ring" cx="32" cy="32" r="24"/>
      <ellipse class="c-grid" cx="32" cy="32" rx="24" ry="9"/>
      <ellipse class="c-grid" cx="32" cy="32" rx="9" ry="24"/>
      <ellipse class="c-eq" id="c-eq" cx="32" cy="32" rx="24" ry="9"/>
      <line class="c-axis" x1="32" y1="4" x2="32" y2="60"/>
      <circle class="c-dot" id="c-dot" cx="32" cy="8" r="3.4"/>
    </svg>
    <span id="c-read">0° · 0°</span>
  </div>

  <aside id="g-panel" aria-live="polite">
    <button type="button" id="g-close" aria-label="Cerrar ficha">✕</button>
    <div id="g-panel-body"></div>
  </aside>

  <p id="g-hint">Arrastra para girar el globo · rueda para acercarte · pulsa un nodo</p>

  <section id="g-time">
    <div class="t-head">
      <h2>Cronología</h2>
      <span id="t-context">el canon completo</span>
      <button type="button" id="t-toggle" aria-expanded="true">Ocultar</button>
    </div>
    <div class="t-types" id="t-types"></div>
    <div class="t-axis"><span id="t-min"></span><span id="t-max"></span></div>
    <div id="t-track"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="graph-data.js"></script>
<script src="graph.js"></script>
</body>
</html>
